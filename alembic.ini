# Alembic CLI config for development, e.g.
#   DB_URL=sqlite:///./dev.db uv run alembic revision --autogenerate -m "add listings"
# The database URL comes from furnest settings (DB_URL / DATA_DIR), not this file.
# The app itself runs migrations through furnest.db.migrate (`furnest migrate`).
[alembic]
script_location = furnest.db:migrations
file_template = %%(rev)s_%%(slug)s
