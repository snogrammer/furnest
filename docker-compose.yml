# Local development stack: builds the image from this checkout.
#
#   cp .env.example .env   # set AUTH_TOKEN and AUTH_SESSION_SECRET at least
#   docker compose up -d --build
#   open http://127.0.0.1:8000
#
# WITH_PLAYWRIGHT=true docker compose build   adds Chromium for browser sources.
# FURNEST_PORT picks the host port for the dashboard (default: 8000).
#
# For a Portainer deployment use docker-compose.portainer.yml instead.
#
# Start order: `migrate` runs once and exits, then `web` and `worker` start.
# All three share the `furnest-data` volume, which holds the SQLite database.
# `docker compose down -v` deletes it.

x-furnest: &furnest
  # Built once by `migrate` (below); web and worker run the same local image.
  image: furnest:local
  pull_policy: never
  # The same .env `uv run furnest ...` reads.
  env_file:
    - path: .env
      required: false
  # Container-internal values. These win over .env, whose WEB_HOST and DATA_DIR
  # are meant for running on the host.
  environment:
    WEB_HOST: 0.0.0.0
    WEB_PORT: "8000"
    DATA_DIR: /data
  volumes:
    - furnest-data:/data
  # tini as PID 1: forwards SIGTERM and reaps Chromium child processes.
  init: true

services:
  migrate:
    <<: *furnest
    # Only one service builds: three builds of one tag would race.
    build:
      context: .
      args:
        WITH_PLAYWRIGHT: ${WITH_PLAYWRIGHT:-false}
    pull_policy: build
    command: ["migrate"]
    healthcheck:
      disable: true

  web:
    <<: *furnest
    command: ["web"]
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    # Loopback only: the dashboard is for this machine.
    ports:
      - "127.0.0.1:${FURNEST_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "furnest-entrypoint", "healthcheck", "web"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  worker:
    <<: *furnest
    command: ["worker"]
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "furnest-entrypoint", "healthcheck", "worker"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    # Above WORKER_SHUTDOWN_TIMEOUT_SECONDS (25 by default) so running jobs can
    # finish.
    stop_grace_period: 30s

volumes:
  furnest-data:
