name: Publish

# Build and push the image after CI passes on main, and for version tags. On main,
# also redeploy the Portainer stack. Pull requests never get here, so they never push.
#
# Repository / organisation configuration (nothing deployment-specific is
# hardcoded):
#   secrets: REGISTRY_USERNAME, REGISTRY_PASSWORD
#            PORTAINER_API_KEY            (only for the redeploy)
#   vars:    REGISTRY                     registry host, e.g. registry.example.com
#            IMAGE                        image path, e.g. org/furnest (default: furnest)
#            IMAGE_PLATFORMS              space-separated, e.g. "linux/amd64 linux/arm64"
#                                         (default: linux/amd64). Non-native platforms
#                                         build under QEMU emulation, so the runner
#                                         must allow binfmt registration (privileged).
#            PORTAINER_URL                e.g. https://portainer.example.com
#            PORTAINER_STACK_ID, PORTAINER_ENDPOINT_ID (default 1)
# The Portainer stack is git-backed, with docker-compose.portainer.yml as its
# compose path (docker-compose.yml is the local build-from-source stack).
# Without REGISTRY nothing is built, and the `config` job warns about it. Without
# PORTAINER_URL/PORTAINER_STACK_ID the image is pushed but no redeploy happens.
#
# Optional signing (skipped with a warning when COSIGN_PRIVATE_KEY is unset):
#   secrets: COSIGN_PRIVATE_KEY, COSIGN_PASSWORD   from `cosign generate-key-pair`
# Each new :<sha> image is signed, and gets a CycloneDX SBOM (Trivy) and a SLSA
# provenance statement attached as cosign attestations. Verify with
#   cosign verify --key cosign.pub $REGISTRY/$IMAGE:<sha>
#   cosign verify-attestation --key cosign.pub --type cyclonedx $REGISTRY/$IMAGE:<sha>
#
# Tags pushed: :<sha> (a multi-arch index) and :<sha>-<arch> per platform, plus
# :latest from main, or :<tag> (e.g. :v1.2.3) from a version tag.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  push:
    tags: ["v*"]

# Gitea can fire workflow_run more than once for one CI run, including while CI is
# still running, with a conclusion of `success` before the slower jobs finish. The
# "CI finished green?" step asks the API for the CI run's real state, and everything
# after it runs only once that run has completed successfully. Runs for one commit
# are serialised, and a run finds `:<sha>` already pushed and exits early, so
# duplicates are no-ops.
concurrency:
  group: publish-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false

jobs:
  config:
    if: vars.REGISTRY == ''
    runs-on: ubuntu-latest
    steps:
      - name: Publishing is not configured
        run: echo "::warning::vars.REGISTRY is unset, so no image is built or pushed. Set REGISTRY and IMAGE (see the header of .github/workflows/publish.yml)."

  publish:
    if: >-
      vars.REGISTRY != '' &&
      (github.event_name == 'push' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    env:
      REGISTRY: ${{ vars.REGISTRY }}
      IMAGE: ${{ vars.IMAGE || 'furnest' }}
      IMAGE_PLATFORMS: ${{ vars.IMAGE_PLATFORMS || 'linux/amd64' }}
      GIT_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      # :latest for main, the tag name (v1.2.3) for tag pushes.
      ALIAS_TAG: ${{ github.event_name == 'push' && github.ref_name || 'latest' }}
      REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
      REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
      PORTAINER_URL: ${{ vars.PORTAINER_URL }}
      PORTAINER_API_KEY: ${{ secrets.PORTAINER_API_KEY }}
      PORTAINER_STACK_ID: ${{ vars.PORTAINER_STACK_ID }}
      PORTAINER_ENDPOINT_ID: ${{ vars.PORTAINER_ENDPOINT_ID || '1' }}
      # Containers polled after redeploy (container_name in docker-compose.portainer.yml).
      PORTAINER_CONTAINERS: "furnest-web furnest-worker"
      COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
      COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
      # Pinned by digest as well as tag, like TRIVY_IMAGE in ci.yml.
      TRIVY_IMAGE: aquasec/trivy:0.69.3@sha256:bcc376de8d77cfe086a917230e818dc9f8528e3c852f7b1aff648949b6258d1c
    steps:
      - name: CI finished green?
        id: gate
        env:
          CI_RUN_ID: ${{ github.event.workflow_run.id }}
          GITEA_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" != "workflow_run" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          run=$(curl -fsS -H "Authorization: token $GITEA_TOKEN" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN_ID")
          state=$(jq -r '"\(.status) \(.conclusion)"' <<<"$run")
          echo "CI run $CI_RUN_ID: $state"
          if [ "$state" = "completed success" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "CI has not finished green yet; a later workflow_run event publishes."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      # Secrets set on an organisation don't reach repositories owned by a user, and
      # an empty secret otherwise surfaces as regctl's "Password is required".
      - name: Check configuration
        if: steps.gate.outputs.ok == 'true'
        run: |
          missing=()
          [ -n "$REGISTRY_USERNAME" ] || missing+=(REGISTRY_USERNAME)
          [ -n "$REGISTRY_PASSWORD" ] || missing+=(REGISTRY_PASSWORD)
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Secrets ${missing[*]} are empty for $GITHUB_REPOSITORY. Add them under the repository's (or its owner's) Settings > Actions > Secrets."
            exit 1
          fi
          # A half-set redeploy target would otherwise skip the redeploy silently.
          if [ -n "$PORTAINER_URL" ]; then
            unset_redeploy=()
            [ -n "$PORTAINER_STACK_ID" ] || unset_redeploy+=(vars.PORTAINER_STACK_ID)
            [ -n "$PORTAINER_API_KEY" ] || unset_redeploy+=(secrets.PORTAINER_API_KEY)
            if [ ${#unset_redeploy[@]} -gt 0 ]; then
              echo "::error::vars.PORTAINER_URL is set but ${unset_redeploy[*]} is empty, so the stack can't be redeployed. Set it, or unset PORTAINER_URL to publish without redeploying."
              exit 1
            fi
          fi

      - name: Checkout
        if: steps.gate.outputs.ok == 'true'
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ env.GIT_SHA }}

      # Images are built into the local daemon, then pushed with regctl rather
      # than `docker push`: a registry behind Cloudflare answers 413 for request
      # bodies over 100 MB, and `docker push` sends each layer in one request.
      - name: Install regctl
        if: steps.gate.outputs.ok == 'true'
        env:
          REGCTL_VERSION: v0.11.6
          REGCTL_SHA256: 8e0e62a497fcdb8048d18aa927a139613176ba0531f412bc541044e28f9856bd
        run: |
          set -euo pipefail
          curl -fsSL -o /usr/local/bin/regctl \
            "https://github.com/regclient/regclient/releases/download/$REGCTL_VERSION/regctl-linux-amd64"
          echo "$REGCTL_SHA256  /usr/local/bin/regctl" | sha256sum -c -
          chmod +x /usr/local/bin/regctl
          # 50 MiB per request keeps every upload under a 100 MB proxy cap.
          regctl registry set "$REGISTRY" --blob-max 52428800 --blob-chunk 52428800
          echo "$REGISTRY_PASSWORD" | regctl registry login "$REGISTRY" -u "$REGISTRY_USERNAME" --pass-stdin

      - name: Already built?
        if: steps.gate.outputs.ok == 'true'
        id: check
        run: |
          if regctl manifest head "$REGISTRY/$IMAGE:$GIT_SHA" >/dev/null 2>&1; then
            echo "Image for $GIT_SHA already pushed by an earlier run; only retagging."
            echo "built=true" >> "$GITHUB_OUTPUT"
          else
            echo "built=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up QEMU
        if: steps.gate.outputs.ok == 'true' && steps.check.outputs.built != 'true' && env.IMAGE_PLATFORMS != 'linux/amd64'
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0

      # Plain `docker` driver: the docker-container driver's BuildKit can't run on
      # cgroup-v1 runner hosts. It builds one platform at a time, so each platform
      # is built, loaded and pushed on its own, and joined into one index below.
      - name: Set up Buildx
        if: steps.gate.outputs.ok == 'true' && steps.check.outputs.built != 'true'
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
        with:
          driver: docker

      - name: Build and push each platform
        if: steps.gate.outputs.ok == 'true' && steps.check.outputs.built != 'true'
        run: |
          set -euo pipefail
          pushed=()
          for platform in $IMAGE_PLATFORMS; do
            arch="${platform#*/}"; arch="${arch//\//-}"
            ref="$REGISTRY/$IMAGE:$GIT_SHA-$arch"
            echo "::group::$platform -> $ref"
            docker buildx build --platform "$platform" --load \
              --build-arg GIT_SHA="$GIT_SHA" -t "$ref" .
            docker save "$ref" -o /tmp/image.tar
            regctl image import "ocidir:///tmp/oci-image:$arch" /tmp/image.tar
            rm -f /tmp/image.tar
            # docker save writes uncompressed layers; gzip them before upload.
            regctl image mod "ocidir:///tmp/oci-image:$arch" --layer-compress gzip --replace
            regctl image copy "ocidir:///tmp/oci-image:$arch" "$ref"
            echo "::endgroup::"
            pushed+=("$platform=$ref")
          done
          rm -rf /tmp/oci-image
          # Single-platform images carry no platform in a new index entry, so set
          # it explicitly; otherwise pulls can't pick the right architecture.
          regctl index create "$REGISTRY/$IMAGE:$GIT_SHA-index"
          for entry in "${pushed[@]}"; do
            regctl index add "$REGISTRY/$IMAGE:$GIT_SHA-index" --ref "${entry#*=}" --desc-platform "${entry%%=*}"
          done
          # Tag :<sha> last: the "Already built?" check treats it as "done".
          regctl image copy "$REGISTRY/$IMAGE:$GIT_SHA-index" "$REGISTRY/$IMAGE:$GIT_SHA"
          # Registries that disable deletes keep the staging tag; harmless.
          regctl tag delete "$REGISTRY/$IMAGE:$GIT_SHA-index" || true
          regctl manifest get "$REGISTRY/$IMAGE:$GIT_SHA" --format '{{range .Manifests}}{{.Platform}} {{.Digest}}{{"\n"}}{{end}}'

      # Server-side copy: the blobs already exist, so nothing is re-uploaded.
      - name: Tag ${{ env.ALIAS_TAG }}
        if: steps.gate.outputs.ok == 'true'
        run: regctl image copy "$REGISTRY/$IMAGE:$GIT_SHA" "$REGISTRY/$IMAGE:$ALIAS_TAG"

      # Sign the multi-arch index digest (not the mutable tag) and attach an SBOM
      # and build provenance as attestations. Runs only for a freshly built image;
      # a retag-only run finds them already attached.
      - name: Install cosign
        if: >-
          steps.gate.outputs.ok == 'true' && steps.check.outputs.built != 'true' &&
          env.COSIGN_PRIVATE_KEY != ''
        uses: sigstore/cosign-installer@7e8b541eb2e61bf99390e1afd4be13a184e9ebc5 # v3.10.1

      - name: Sign image, attach SBOM and provenance
        if: >-
          steps.gate.outputs.ok == 'true' && steps.check.outputs.built != 'true' &&
          env.COSIGN_PRIVATE_KEY != ''
        run: |
          set -euo pipefail
          digest=$(regctl manifest digest "$REGISTRY/$IMAGE:$GIT_SHA")
          ref="$REGISTRY/$IMAGE@$digest"
          echo "$REGISTRY_PASSWORD" | cosign login "$REGISTRY" -u "$REGISTRY_USERNAME" --password-stdin
          # CycloneDX SBOM of the pushed image, read from the registry.
          docker run --rm -e TRIVY_USERNAME="$REGISTRY_USERNAME" -e TRIVY_PASSWORD="$REGISTRY_PASSWORD" \
            --entrypoint sh "$TRIVY_IMAGE" -c \
            "trivy image --quiet --image-src remote --format cyclonedx '$ref' > /tmp/sbom.json && cat /tmp/sbom.json" \
            > "$RUNNER_TEMP/sbom.cdx.json"
          test -s "$RUNNER_TEMP/sbom.cdx.json"
          # SLSA v0.2 provenance predicate: what was built, from which commit, by which run.
          jq -n --arg repo "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" --arg sha "$GIT_SHA" \
            --arg run "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --arg platforms "$IMAGE_PLATFORMS" --arg now "$(date -u +%Y-%m-%dT%H:%M:%SZ)" '{
              builder: {id: $run},
              buildType: "https://docs.docker.com/build/",
              invocation: {configSource: {uri: ("git+" + $repo), digest: {sha1: $sha}, entryPoint: "Dockerfile"},
                           parameters: {platforms: $platforms}},
              metadata: {buildFinishedOn: $now, completeness: {parameters: true, environment: false, materials: false}},
              materials: [{uri: ("git+" + $repo), digest: {sha1: $sha}}]
            }' > "$RUNNER_TEMP/provenance.json"
          cosign sign --yes --key env://COSIGN_PRIVATE_KEY "$ref"
          cosign attest --yes --key env://COSIGN_PRIVATE_KEY --type cyclonedx \
            --predicate "$RUNNER_TEMP/sbom.cdx.json" "$ref"
          cosign attest --yes --key env://COSIGN_PRIVATE_KEY --type slsaprovenance \
            --predicate "$RUNNER_TEMP/provenance.json" "$ref"
          echo "signed $ref"

      - name: Image signing is not configured
        if: >-
          steps.gate.outputs.ok == 'true' && steps.check.outputs.built != 'true' &&
          env.COSIGN_PRIVATE_KEY == ''
        run: echo "::warning::secrets.COSIGN_PRIVATE_KEY is unset, so the image is not signed and has no SBOM or provenance."

      # Runs on retag-only runs too, so re-running Publish redeploys. The script
      # exits early when the containers already run the pulled image.
      - name: Redeploy stack in Portainer
        if: >-
          steps.gate.outputs.ok == 'true' &&
          github.event_name == 'workflow_run' &&
          env.PORTAINER_URL != '' && env.PORTAINER_STACK_ID != ''
        env:
          REGISTRY_REF_NAME: refs/heads/main # branch Portainer pulls the stack file from
        run: bash deploy/portainer-redeploy.sh

      - name: Redeploy is not configured
        if: >-
          steps.gate.outputs.ok == 'true' &&
          github.event_name == 'workflow_run' && env.PORTAINER_URL == ''
        run: echo "::warning::vars.PORTAINER_URL is unset, so :latest was pushed but no stack was redeployed."

      - name: Cleanup containers and images
        if: always() && steps.gate.outputs.ok == 'true'
        run: docker system prune -af
