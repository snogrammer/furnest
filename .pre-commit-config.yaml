# Hooks run through `uv run` so they use the exact tool versions pinned in uv.lock.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types_or: [python, pyi]
      - id: mypy
        name: mypy
        entry: uv run mypy
        language: system
        types_or: [python, pyi]
        pass_filenames: false
      - id: hygiene
        name: open-source hygiene
        entry: uv run --no-project scripts/check_hygiene.py
        language: system
        types: [text]
