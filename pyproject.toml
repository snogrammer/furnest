[project]
name = "furnest"
version = "0.1.0"
description = "Self-hosted furnished-rental monitor: scrape, match, notify, inquire, track."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
]

[project.scripts]
furnest = "furnest.cli:app"

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pre-commit>=3.8",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "N", "PTH", "ANN"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers -ra --cov=furnest --cov-report=term-missing"
markers = [
    "unit: fast, isolated tests",
    "integration: tests that exercise several components together",
    "migrations: Alembic migration tests",
]

[tool.coverage.run]
branch = true
source = ["furnest"]

[tool.coverage.report]
show_missing = true
skip_covered = false
