{% extends "base.html" %}
{% block title %}Sign in · furnest{% endblock %}
{% block content %}
<section class="login">
  <div class="login-brand">
    <img src="{{ url_for('static', path='brand/icon-180.png').path }}" width="64" height="64" alt="">
    <p class="wordmark">furnest</p>
    <p class="tagline">self-hosted furnished-rental monitor</p>
  </div>
  <h1>Sign in</h1>
  {% if error %}<p class="form-error" role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="/login">
    {{ csrf_field(request) }}
    <input type="hidden" name="next" value="{{ next }}">
    <label for="token">Access token</label>
    <input id="token" name="token" type="password" autocomplete="current-password" required autofocus>
    <button type="submit">Sign in</button>
  </form>
</section>
{% endblock %}
