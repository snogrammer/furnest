<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {# Keep htmx inside the self-only CSP: no injected <style>, no eval. #}
  {# Swap 409/422 too, so conflicts and validation errors render in place. #}
  <meta name="htmx-config" content='{"includeIndicatorStyles": false, "allowEval": false, "responseHandling": [{"code": "204", "swap": false}, {"code": "[23]..", "swap": true}, {"code": "409|422", "swap": true, "error": false}, {"code": "[45]..", "swap": false, "error": true}, {"code": "...", "swap": false}]}'>
  <title>{% block title %}furnest{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='css/app.css').path }}">
  <script src="{{ url_for('static', path='vendor/htmx.min.js').path }}" defer></script>
</head>
<body hx-headers='{"X-CSRF-Token": "{{ csrf_token(request) }}"}'>
  <header class="site-header">
    <a class="brand" href="/">furnest</a>
    {% if request.state.auth %}
    <nav aria-label="Main">
      <ul>
        <li><a href="/" {% if request.url.path == "/" %}aria-current="page"{% endif %}>Dashboard</a></li>
        <li><a href="/criteria" {% if request.url.path.startswith("/criteria") %}aria-current="page"{% endif %}>Criteria</a></li>
      </ul>
    </nav>
    {% endif %}
    {% if request.state.auth == "session" %}
    <form class="logout" method="post" action="/logout">
      {{ csrf_field(request) }}
      <button type="submit" class="link-button">Log out</button>
    </form>
    {% endif %}
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer">furnest {{ version }}</footer>
</body>
</html>
