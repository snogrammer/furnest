<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {# Keep htmx inside the self-only CSP: no injected <style>, no eval. #}
  {# Swap 409/422 too, so conflicts and validation errors render in place. #}
  <meta name="htmx-config" content='{"includeIndicatorStyles": false, "allowEval": false, "responseHandling": [{"code": "204", "swap": false}, {"code": "[23]..", "swap": true}, {"code": "409|422", "swap": true, "error": false}, {"code": "[45]..", "swap": false, "error": true}, {"code": "...", "swap": false}]}'>
  <title>{% block title %}furnest{% endblock %}</title>
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', path='brand/icon-32.png').path }}">
  <link rel="apple-touch-icon" href="{{ url_for('static', path='brand/icon-180.png').path }}">
  <meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1e293b" media="(prefers-color-scheme: dark)">
  <link rel="stylesheet" href="{{ url_for('static', path='css/app.css').path }}">
  <script src="{{ url_for('static', path='vendor/htmx.min.js').path }}" defer></script>
  <script src="{{ url_for('static', path='js/copy.js').path }}" defer></script>
  <script src="{{ url_for('static', path='js/dates.js').path }}" defer></script>
  {% block scripts %}{% endblock %}
</head>
<body hx-headers='{"X-CSRF-Token": "{{ csrf_token(request) }}"}'>
  <header class="site-header">
    <a class="brand" href="/"><img src="{{ url_for('static', path='brand/icon-64.png').path }}" width="28" height="28" alt="">furnest</a>
    {% if request.state.auth %}
    <nav aria-label="Main">
      <ul>
        <li><a href="/" {% if request.url.path == "/" %}aria-current="page"{% endif %}>Dashboard</a></li>
        <li><a href="/criteria" {% if request.url.path.startswith("/criteria") %}aria-current="page"{% endif %}>Criteria</a></li>
        <li><a href="/inquiries" {% if request.url.path.startswith("/inquiries") %}aria-current="page"{% endif %}>Inquiries</a></li>
        <li><a href="/email-templates" {% if request.url.path.startswith("/email-templates") %}aria-current="page"{% endif %}>Email</a></li>
        <li><a href="/sources" {% if request.url.path.startswith("/sources") %}aria-current="page"{% endif %}>Sources</a></li>
        <li><a href="/settings" {% if request.url.path.startswith("/settings") %}aria-current="page"{% endif %}>Settings</a></li>
        <li><a href="/api/docs">API</a></li>
      </ul>
    </nav>
    {% endif %}
    {% if request.state.auth == "session" %}
    <form class="logout" method="post" action="/logout">
      {{ csrf_field(request) }}
      <button type="submit" class="link-button">Log out</button>
    </form>
    {% endif %}
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer">furnest {{ version }}</footer>
</body>
</html>
