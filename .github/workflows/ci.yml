name: CI

# GitHub Actions syntax, run as-is by Gitea Actions (which reads .github/workflows
# when there is no .gitea/workflows). Feature branches are checked through their
# pull request only, so a shared runner does each change once.
#
# Images are built here but never pushed. publish.yml pushes after CI passes
# on main, and on version tags.
#
# Security checks: the `audit` job runs pip-audit on the locked dependencies, and
# `docker-build` scans the built image with Trivy. Both fail on known
# vulnerabilities that have a fix. The `hygiene` job fails on anything personal in
# the tree (scripts/check_hygiene.py) and on secrets anywhere in history (gitleaks).
on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]

env:
  UV_VERSION: "0.11.16"
  PIP_AUDIT_VERSION: "2.10.1"
  # Pinned by digest as well as tag: a scanner runs with the image in hand.
  TRIVY_IMAGE: aquasec/trivy:0.69.3@sha256:bcc376de8d77cfe086a917230e818dc9f8528e3c852f7b1aff648949b6258d1c

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No cache: the shared runner has no cache backend and the save step hangs.
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false

      - name: Install dependencies
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy

  # Known vulnerabilities in the locked dependencies (every extra and the dev group
  # too, since they run in CI), from the PyPI/OSV advisory databases. --strict
  # fails on any package that can't be audited instead of skipping it.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false

      - name: Audit dependencies
        run: |
          uv export --frozen --all-extras --no-emit-project --quiet -o "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit==${{ env.PIP_AUDIT_VERSION }} --strict --disable-pip --require-hashes \
            --progress-spinner off -r "$RUNNER_TEMP/requirements.txt"

  # Nothing personal ships: emails, domains, public IPs, phone numbers and precise
  # coordinates outside .hygiene.toml's allowlists, plus the private terms in the
  # HYGIENE_DENYLIST secret (comma-separated; optional). Then gitleaks over every
  # commit, and a planted token to prove .gitleaks.toml's allowlist can't hide one.
  hygiene:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false

      # Standard library only, so no dependencies are installed.
      - name: Personal data
        env:
          HYGIENE_DENYLIST: ${{ secrets.HYGIENE_DENYLIST }}
        run: uv run --no-project scripts/check_hygiene.py

      - name: Install gitleaks
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v$GITLEAKS_VERSION/$tarball"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C /usr/local/bin gitleaks
          gitleaks version

      - name: Secrets in history
        run: gitleaks git --no-banner --redact --config .gitleaks.toml .

      # A random GitHub-token-shaped value must be reported, or the allowlist (or a
      # gitleaks upgrade) has stopped secrets being caught.
      - name: Secret scan catches a planted token
        run: |
          set -euo pipefail
          plant="$RUNNER_TEMP/plant"
          mkdir -p "$plant"
          printf 'GITHUB_TOKEN=ghp_%s\n' "$(head -c 64 /dev/urandom | base64 | tr -dc A-Za-z0-9 | head -c 36)" > "$plant/env"
          if gitleaks dir --no-banner --redact --config .gitleaks.toml "$plant"; then
            echo "::error::gitleaks did not report the planted token"
            exit 1
          fi
          echo "planted token reported"

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false

      - name: Install dependencies
        run: uv sync --frozen

      # Network sockets are refused (pytest-socket, see addopts in pyproject.toml),
      # and coverage below [tool.coverage.report] fail_under fails the job.
      # -n auto: one xdist worker per CPU; pytest-cov combines their coverage.
      - name: Tests with coverage
        run: |
          echo "CPUs: $(nproc)"
          uv run pytest -m "not migrations" -n auto --tb=short --cov-report=term --cov-report=xml

  migrations:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: false

      - name: Install dependencies
        run: uv sync --frozen

      # Upgrade/downgrade round-trips and "models match migrations". Coverage is
      # measured by the test job; this subset alone would miss the threshold.
      - name: Migration tests
        run: uv run pytest -m migrations --tb=short --no-cov

      - name: Models and migrations agree
        env:
          DB_URL: sqlite:///${{ runner.temp }}/alembic-check.db
        run: |
          uv run furnest migrate
          uv run alembic check

  docker-build:
    runs-on: ubuntu-latest
    needs: lint
    env:
      IMAGE: furnest:ci-${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      # Plain `docker` driver: the docker-container driver's BuildKit can't run
      # on cgroup-v1 runner hosts.
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: ${{ env.IMAGE }}
          build-args: |
            GIT_SHA=${{ github.sha }}

      # The entrypoint starts as root, so this checks the app process itself.
      - name: Smoke test web, worker and migrate as non-root
        run: |
          set -euo pipefail
          name="furnest-ci-${{ github.run_id }}"
          vol="$name-data"
          env=(-e AUTH_TOKEN=ci-token-0123456789abcdef -e AUTH_SESSION_SECRET=ci-secret-0123456789abcdef)
          # shellcheck disable=SC2329 # invoked by the trap
          cleanup() { docker rm -f "$name-web" "$name-worker" >/dev/null 2>&1 || true; docker volume rm "$vol" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          docker run --rm "$IMAGE" --version
          docker run --rm -v "$vol:/data" "$IMAGE" migrate
          docker run -d --name "$name-web" -v "$vol:/data" "${env[@]}" "$IMAGE" web
          docker run -d --name "$name-worker" -v "$vol:/data" "$IMAGE" worker
          healthy=no
          for _ in $(seq 1 30); do
            if docker exec "$name-web" furnest-entrypoint healthcheck web \
              && docker exec "$name-worker" furnest-entrypoint healthcheck worker; then
              healthy=yes
              break
            fi
            sleep 2
          done
          if [ "$healthy" != yes ]; then
            echo "::error::containers did not become healthy"
            docker logs "$name-web" 2>&1 | tail -50
            docker logs "$name-worker" 2>&1 | tail -50
            exit 1
          fi
          echo "web and worker healthy"
          for c in "$name-web" "$name-worker"; do
            uids=$(docker exec "$c" awk '/^Uid:/ {print $2, $3}' /proc/1/status)
            echo "$c PID 1 uid (real, effective): $uids"
            test "$uids" = "10001 10001"
          done
          # Probes ran through the entrypoint, so nothing in /data is root-owned.
          stray=$(docker exec "$name-worker" find /data ! -uid 10001)
          if [ -n "$stray" ]; then
            echo "::error::files in /data not owned by uid 10001: $stray"
            exit 1
          fi

      # Docker creates a missing bind-mount directory owned by root. A root-owned
      # volume stands in for it (CI can't bind-mount runner paths), plus a stray
      # root-owned file like the WAL files a `docker exec` as root leaves behind.
      # The file also matters because Docker resets an *empty* volume to the
      # image's /data ownership on mount, which would hide the problem.
      - name: Root-owned data directory is taken over
        run: |
          set -euo pipefail
          vol="furnest-ci-${{ github.run_id }}-rootdata"
          # shellcheck disable=SC2329 # invoked by the trap
          cleanup() { docker volume rm "$vol" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          docker run --rm --user 0 --entrypoint sh -v "$vol:/data" "$IMAGE" \
            -c 'chown -R 0:0 /data && chmod 0755 /data && touch /data/furnest.db-shm'
          docker run --rm -v "$vol:/data" "$IMAGE" migrate
          stray=$(docker run --rm --user 0 --entrypoint find -v "$vol:/data" "$IMAGE" /data ! -uid 10001)
          if [ -n "$stray" ]; then
            echo "::error::files in /data not owned by uid 10001: $stray"
            exit 1
          fi
          docker run --rm --user 0 --entrypoint ls -v "$vol:/data" "$IMAGE" -lan /data

      # HIGH/CRITICAL vulnerabilities that have a fix, in OS packages or Python
      # dependencies. Unfixed ones can't be acted on, so they don't fail the build
      # (run `trivy image` locally to see them). The image goes in on stdin: the
      # job can't bind-mount runner paths, and Trivy needs no Docker socket.
      - name: Scan image for vulnerabilities
        run: |
          set -euo pipefail
          docker save "$IMAGE" | docker run --rm -i --entrypoint sh "$TRIVY_IMAGE" -c \
            'cat > /tmp/image.tar && trivy image --input /tmp/image.tar --quiet --ignore-unfixed --severity HIGH,CRITICAL --exit-code 1'

      - name: Compose files validate
        run: |
          docker compose config -q
          echo "docker-compose.yml is valid"
          cp stack.env.example stack.env
          docker compose -f docker-compose.portainer.yml --env-file stack.env config -q
          echo "docker-compose.portainer.yml is valid"

      - name: Remove CI image
        if: always()
        run: docker image rm -f "$IMAGE" || true
