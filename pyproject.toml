[project]
name = "furnest"
version = "0.1.0"
description = "Self-hosted furnished-rental monitor: scrape, match, notify, inquire, track."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "apscheduler>=3.11,<4",
    "fastapi>=0.142.2",
    "httpx2>=2.13.1",
    "imagehash>=4.3",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.6",
    "markdown-it-py>=3.0",
    "nh3>=0.3.7",
    "pillow>=11",
    "pydantic-settings>=2.4",
    "pydantic[email]>=2.8",
    "pynacl>=1.5",
    "python-multipart>=0.0.32",
    "sentry-sdk>=2.71.0",
    "sqlalchemy>=2.0",
    "structlog>=26.1.0",
    "typer>=0.12",
    "usaddress>=0.5.16",
    "uvicorn>=0.54.0",
]

[project.scripts]
furnest = "furnest.cli:app"

[project.optional-dependencies]
browser = [
    "playwright>=1.63.0",
]

[dependency-groups]
dev = [
    "aiosmtpd>=1.4.6",
    "mypy>=1.11",
    "pre-commit>=3.8",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "pytest-socket>=0.8.1",
    "ruff>=0.6",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "S", "N", "PTH", "ANN"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests", "scripts"]
mypy_path = "src"

[[tool.mypy.overrides]]
# APScheduler 3.x ships no type hints; it is only used in furnest.worker.runtime.
module = "apscheduler.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Playwright is the optional `browser` extra; CI type-checks without it installed.
module = "playwright.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# usaddress ships an __init__.pyi but no py.typed marker; use its stub anyway.
module = "usaddress.*"
follow_untyped_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# --disable-socket: tests never touch the network (pytest-socket). Unix sockets stay
# allowed because asyncio uses a socketpair for its event-loop wakeups.
addopts = "--strict-markers -ra --cov=furnest --cov-report=term-missing --disable-socket --allow-unix-socket"
markers = [
    "unit: fast, isolated tests",
    "integration: tests that exercise several components together",
    "migrations: Alembic migration tests",
]

[tool.coverage.run]
branch = true
source = ["furnest"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 90
